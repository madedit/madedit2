name: madedit2
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+2

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Localization: flutter_localizations provides localization for built-in
  # Material/Cupertino widgets and locale resolution; intl provides date/number
  # formatting. menubar text uses a custom ARB runtime dictionary
  # (lib/l10n/app_localizations.dart + assets/l10n/*.arb), looked up dynamically
  # via JSON labelKey.
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Cross-platform file picking for opening files / loading a custom keymap in the editor.
  file_picker: ^13.1.0

  # Syntax highlighting: tree-sitter backend in Rust, called cross-platform via flutter_rust_bridge (rust/ crate).
  rust_lib_madedit2:
    path: rust_builder
  flutter_rust_bridge: ^2.13.0
  docking: ^1.16.2
  window_manager: ^0.5.2

  # Opens the sponsor-page links of the donate dialog in the system browser.
  url_launcher: ^6.3.1

  # Utf16/allocator helpers for dart:ffi — the file-association dialog talks
  # to the Windows registry directly (advapi32) instead of spawning
  # PowerShell, whose cold start made opening the dialog take seconds.
  ffi: ^2.2.0

  # Drag & drop files onto the window to open them (desktop drop events).
  desktop_drop: ^0.8.4
  printing: ^5.15.0
  pdf: ^3.13.0
  # Path-only "save as" dialog on Windows/Linux (file_picker's saveFile writes
  # its bytes into the chosen path when the dialog closes, which truncated the
  # file being edited when the user picked it). macOS uses the native panel.
  file_selector: ^1.1.0
  # Grapheme-cluster stepping in Document.charLeft/charRight (a letter with
  # its combining marks, an emoji ZWJ sequence… is one Backspace / arrow).
  characters: ^1.4.1

# App icon (assets/icons/madedit2.svg is the source of truth; the PNGs are
# renders of it — madedit2.png full-bleed square, madedit2_android.svg/.png
# the same art at the adaptive-safe 0.7 scale (Android legacy icons),
# madedit2_adaptive_fg.png fangs-only on transparency for the Android
# adaptive foreground, madedit2_macos.png on Apple's Big Sur tile template:
# rounded square at 80.5% of the canvas, transparent margin). Regenerate
# with: dart run flutter_launcher_icons. Linux isn't supported by the
# package; its freedesktop icon set lives in linux/icons/
# (+ linux/madedit2.desktop).
flutter_launcher_icons:
  image_path: "assets/icons/madedit2.png"
  image_path_android: "assets/icons/madedit2_android.png"
  android: true
  adaptive_icon_background: "#CDF2F9"
  adaptive_icon_foreground: "assets/icons/madedit2_adaptive_fg.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icons/madedit2.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/madedit2_macos.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/keymaps/
    # menubar: l10n translations (standard .arb, loaded at runtime) and menu structure definition (JSON)
    - assets/l10n/
    - assets/menus/
    # lexer config for the pure-Dart fallback highlighter (seeded to settings/highlight.json)
    - assets/highlight.json
    # document outline rules (seeded to settings/outline.json)
    - assets/outline.json
    # toolbar definition (seeded to settings/toolbar.json)
    - assets/toolbar.json
    # example user script (seeded to settings/scripts/)
    - assets/scripts/
    # app icon shown in the About dialog (render of madedit2.svg)
    - assets/icons/madedit2.png
    # BEGIN grammars (generated by tool/gen_grammar_assets.dart)
    # Bundled WASM syntax grammars. settings/grammars/<lang>/ overrides the bundled copy.
    - assets/grammars/ada/
    - assets/grammars/asciidoc/
    - assets/grammars/asciidoc_inline/
    - assets/grammars/asm/
    - assets/grammars/bash/
    - assets/grammars/batch/
    - assets/grammars/c/
