    - assets/grammars/gdscript/
    - assets/grammars/gdshader/
    - assets/grammars/glsl/
    - assets/grammars/go/
    - assets/grammars/groovy/
    - assets/grammars/haskell/
    - assets/grammars/hlsl/
    - assets/grammars/html/
    - assets/grammars/ini/
    - assets/grammars/java/
    - assets/grammars/javascript/
    - assets/grammars/json/
    - assets/grammars/kconfig/
    - assets/grammars/kotlin/
    - assets/grammars/latex/
    - assets/grammars/lua/
    - assets/grammars/make/
    - assets/grammars/markdown/
    - assets/grammars/matlab/
    - assets/grammars/nginx/
    - assets/grammars/php/
    - assets/grammars/powershell/
    - assets/grammars/python/
    - assets/grammars/ruby/
    - assets/grammars/rust/
